services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-native_upload}
    # for pgAdmin
    ports:
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # wait for postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=${PORT:-5000}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-10}
      - DB_NAME=${DB_NAME:-native_upload}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # db = service name
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DIALECT=postgres
      - DB_LOGGING=${DB_LOGGING:-false}
    ports:
      - '${HOST_PORT:-5000}:${PORT:-5000}'
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
  pgdata:
